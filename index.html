/* More natural running: opposite arms and legs swing from the shoulder and hip. */
.runner{animation:runner-stride .58s ease-in-out infinite}

.runner .leg{transform-origin:16px 28px;animation-name:leg-cycle}

.runner .arm{transform-origin:17px 18px;animation-name:arm-cycle}
.runner .arm.back{animation-delay:-.29s}

.unit-choice{min-height:90px;background:#42374f;border-color:#b488a5;color:#fff1e1}.unit-choice.selected{background:#735270;border-color:#ffcf8b}.lesson-choice{min-height:62px;padding:9px 12px;background:#263e49;border-color:#578a8e;font-size:14px;box-shadow:3px 3px #101923}.lesson-choice small{font-size:12px;margin-top:2px;color:#b9d6cf}.lesson-choice.selected{background:#315e5e;border-color:#8ce2bb}.lesson-choice:focus-visible,.unit-choice:focus-visible{outline:3px solid #fff2bd}</style></head><body><main class="app"><header><div class="brand"><span class="logo">✦</span><span>记忆旅人<br><span class="meta">MEMORY ODYSSEY</span></span></div><div class="header-right"><span class="tag">✦ 每一次回忆，都是一次冒险</span><span id="headxp" class="tag">✧ 0 星尘</span><button class="button secondary reward-mobile" onclick="openRewards()">旅伴奖励</button></div></header><div id="home"><div class="layout"><div><section class="hero frame"><div class="hero-content"><div class="eyebrow">✦ KNOWLEDGE IS YOUR POWER</div><h1>把知识装进卡牌<br>开启思维冒险</h1><p>穿过记忆迷雾，探索历史与政治的世界。在回忆、分析与选择中，找到属于你的解题路径。</p><button class="button" onclick="document.getElementById('modes').scrollIntoView({behavior:'smooth'})">选择冒险路线</button></div></section><div class="section-title" id="modes"><h2>选择你的冒险</h2><span>两片世界，两种解题方式</span></div><div class="modes"><button class="mode" onclick="chooseCourse('politics')"><span class="glyph">✧</span><h3>政治 · 观念之境</h3><p>唤醒知识卡牌，解读材料线索，用原理照亮现实。</p><span class="go">开始探索 ▸</span></button><button class="mode history" onclick="chooseCourse('history')"><span class="glyph">⌛</span><h3>历史 · 时光长廊</h3><p>搜集史料碎片，连接时代背景，推演历史的因果。</p><span class="go">开始探索 ▸</span></button></div></div><aside class="aside frame"><h2>✦ 你的旅伴</h2><div class="pet" id="pet-display"><span class="pet-accessory" id="pet-accessory"></span><svg class="pixel-pet" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#292240" d="M3 1h3v2h4V1h3v4h1v7h-2v2H4v-2H2V5h1z"/><path fill="#e7c4a5" d="M4 2h1v3H4zm7 0h1v3h-1zM4 4h8v1h1v6h-2v2H5v-2H3V5h1z"/><path fill="#755674" d="M5 7h2v2H5zm4 0h2v2H9z"/><path fill="#f79ca6" d="M4 10h2v1H4zm6 0h2v1h-2z"/><path fill="#fff3de" d="M7 10h2v1H7z"/></svg></div><div class="pet-name"><strong>小忆</strong><span id="petlevel">LV. 1</span></div><div class="bar"><span id="petbar" style="width:5%"></span></div><div class="sub" id="petxp">0 / 50 星尘</div><div class="sub" id="pet-coins"></div><button class="button secondary reward-button" onclick="openRewards()">旅伴奖励与装扮</button><hr><h2>◈ 冒险记录</h2><div class="stat"><span>完成冒险</span><strong id="runs">0 次</strong></div><div class="stat"><span>独立答对</span><strong id="correct">0 题</strong></div><div class="stat"><span>知识碎片</span><strong id="fragments">0 枚</strong></div><hr><div class="tip">✦ 小忆说：不看提示地回忆一次，比反复看答案更有力量。</div></aside></div></div><div id="game" class="hidden"></div><div class="footer">✦&nbsp; 把每一次思考，变成向前的力量 &nbsp;✦</div></main><script src="curriculum.js"></script><script>
const bank={politics:{name:'政治 · 观念之境',short:'政治',icon:'✧',knowledge:'一切从实际出发，要求我们尊重客观规律，从客观存在的事物出发。发挥主观能动性，要以尊重客观规律为前提。',recall:'制定方案时，为什么既要调查实际情况，又不能只凭主观愿望？',stages:[{title:'知识觉醒',type:'recall'},{title:'线索遭遇',q:'某地制定种植方案前，先调查当地气候和土壤。材料主要体现了什么？',opts:['从客观实际出发，尊重当地条件','意识可以脱离客观条件决定一切','只要有愿望就一定能取得成功'],answer:0,explain:'线索是“先调查气候和土壤”。从实际情况出发制定方案，体现从客观实际出发。'},{title:'观念交锋',q:'“只要充分发挥主观能动性，就能克服一切客观条件的限制。”这句话的问题是什么？',opts:['否认了人的主观能动性','夸大主观能动性，忽视尊重客观规律和条件','认为调查实际很重要'],answer:1,explain:'发挥主观能动性需要尊重客观规律，不能把人的作用夸大为不受任何客观条件限制。'},{title:'原理连结',q:'某地先调查土地条件，再组织技术人员研发适合当地的节水技术。最恰当的分析是？',opts:['只体现尊重客观条件，与人的能动作用无关','先从当地实际出发，再发挥主观能动性探索解决办法','技术方案完全不受土地条件影响'],answer:1,explain:'“调查土地条件”对应从实际出发；“研发适合当地的技术”体现发挥主观能动性。两者要结合。'},{title:'首领 · 材料试炼',q:'某地发现传统灌溉耗水过高，于是调查水资源状况，并组织农户试验节水技术，根据效果不断调整。哪条答题思路最贴合材料？',opts:['先调查水资源体现从实际出发；试验并调整体现发挥主观能动性，做到二者结合','只写“意识决定物质”，忽略调查与试验','照搬所有哲学原理，不必联系材料'],answer:0,explain:'把材料拆为“调查水资源”和“试验、调整”两处，再分别联系从实际出发与发挥主观能动性。知识要与材料对应。'}]},history:{name:'历史 · 时光长廊',short:'历史',icon:'⌛',knowledge:'分析历史事件的原因，要将事件放回特定时代：从材料寻找背景、问题与需求，结合所学说明这些因素如何推动事件，并避免脱离证据扩大结论。',recall:'分析历史事件的原因时，为什么要先确定时间背景、再寻找材料证据？',stages:[{title:'史识觉醒',type:'recall'},{title:'史料搜寻',q:'材料说：“交通改善后，商品更容易进入周边市场。”如果分析商业发展的原因，哪一项最有材料依据？',opts:['交通改善扩大了商品流通的条件','所有地区同时实现工业化','商品流通完全不需要市场'],answer:0,explain:'材料明确提供“交通改善”和“商品进入周边市场”的联系。其余选项超出了材料或与之矛盾。'},{title:'时代辨析',q:'分析某项历史改革的背景时，下列做法最合理的是？',opts:['不看年代，用今天的条件直接解释','结合改革发生时的社会条件与具体问题','只写“为了发展”，不说明任何背景'],answer:1,explain:'历史解释要放回特定时代，结合当时条件与具体问题，不以今天的情况直接替代历史背景。'},{title:'因果拼图',q:'材料表明某地人口增加、土地紧张，政府因此调整土地制度。哪条因果链最符合材料？',opts:['人口增加 → 土地紧张 → 调整土地制度','调整土地制度 → 人口一定减少 → 市场消失','人口增加 → 所有社会矛盾立即解决'],answer:0,explain:'材料直接给出了人口、土地压力和制度调整之间的线索。推理不能添加没有根据的必然结果。'},{title:'首领 · 史料推演',q:'材料记载：某地区新道路建成后，外地商人增多，集市逐渐扩大。题目要求“根据材料分析集市扩大的原因”。哪种回答更合适？',opts:['道路改善便利往来，吸引外地商人，推动集市扩大','该地区必然成为全国唯一商业中心','直接写“经济发展”，不需要说明材料依据'],answer:0,explain:'抓住“道路建成—商人增多—集市扩大”的证据链。回答要解释联系，不要夸大到材料无法证明的范围。'}]}};
let save;try{save=JSON.parse(localStorage.getItem('memory_odyssey_v1'))||{xp:0,runs:0,correct:0,fragments:0}}catch(e){save={xp:0,runs:0,correct:0,fragments:0}}const rewardItems=[{level:2,name:'冒险发带',icon:'🎀'},{level:3,name:'星光发卡',icon:'✦'},{level:4,name:'旅者王冠',icon:'♛'},{level:5,name:'幸运四叶草',icon:'☘'}];if(!save.rewardState){save.rewardState={claimedLevel:1,tokens:0,equipped:null}}let run=null;let selectedCourse={which:null,unit:0,lesson:0};let motionPaused=false;const $=s=>document.querySelector(s);function persist(){try{localStorage.setItem('memory_odyssey_v1',JSON.stringify(save))}catch(e){}}function update(){let xp=save.xp||0;$('#headxp').textContent='✧ '+xp+' 星尘';$('#petlevel').textContent='LV. '+(Math.floor(xp/50)+1);$('#petxp').textContent=(xp%50)+' / 50 星尘';$('#petbar').style.width=Math.max(5,(xp%50)*2)+'%';$('#runs').textContent=save.runs+' 次';$('#correct').textContent=save.correct+' 题';$('#fragments').textContent=save.fragments+' 枚';$('#pet-coins').textContent='旅伴徽章 '+save.rewardState.tokens+' 枚';let accessory=rewardItems.find(x=>x.name===save.rewardState.equipped);$('#pet-accessory').textContent=accessory?accessory.icon:''}function claimRewards(){let level=Math.floor((save.xp||0)/50)+1;let pending=Math.max(0,level-save.rewardState.claimedLevel);if(!pending)return;save.rewardState.tokens+=pending*10;save.rewardState.claimedLevel=level;persist();openRewards()}function equipReward(name){const item=rewardItems.find(x=>x.name===name);if(!item||Math.floor((save.xp||0)/50)+1<item.level||save.rewardState.claimedLevel<item.level)return;save.rewardState.equipped=name;persist();openRewards()}function openRewards(){let level=Math.floor((save.xp||0)/50)+1,pending=Math.max(0,level-save.rewardState.claimedLevel);$('#home').classList.add('hidden');$('#game').classList.remove('hidden');$('#game').innerHTML=`<section class="choice-panel frame"><span class="eyebrow">✦ 旅伴成长</span><h1>小忆的奖励小屋</h1><p>当前 LV. ${level} · 每升一级获得 10 枚旅伴徽章，达到指定等级还能解锁装扮。</p><div class="tip">旅伴徽章：${save.rewardState.tokens} 枚 · 当前装扮：${save.rewardState.equipped||'尚未佩戴'}</div>${pending?`<div class="reward-alert">可以领取 ${pending} 级的奖励：${pending*10} 枚徽章，及对应等级的装扮。<div class="controls"><button class="button" onclick="claimRewards()">领取升级奖励</button></div></div>`:''}<div class="reward-grid">${rewardItems.map(item=>{let unlocked=save.rewardState.claimedLevel>=item.level;return `<div class="reward-card"><span class="reward-icon">${item.icon}</span><strong>${item.name}</strong><div class="sub">LV. ${item.level} 解锁 ${unlocked?'· 已领取':'· 未领取'}</div><button class="button secondary" ${unlocked?'':'disabled'} onclick="equipReward('${item.name}')">${save.rewardState.equipped===item.name?'已佩戴':'佩戴'}</button></div>`}).join('')}</div><div class="controls"><button class="button secondary" onclick="home()">返回营地</button></div></section>`;update();window.scrollTo(0,0)}
function chooseCourse(which,unit=0,lesson=0){selectedCourse={which,unit,lesson};const subject=curriculum[which],chosen=subject[unit],course=chosen.lessons[lesson];$('#home').classList.add('hidden');$('#game').classList.remove('hidden');$('#game').innerHTML=`<section class="choice-panel frame"><span class="eyebrow">✦ 冒险准备</span><h1>${which==='politics'?'政治 · 观念之境':'历史 · 时光长廊'}</h1><p class="sub">先选教材和课时。每次冒险包含 5 个知识点，并逐步挑战材料题。</p><h2 class="selection-title">选择教材</h2><div class="selection-row">${subject.map((u,i)=>`<button class="unit-choice ${i===unit?'selected':''}" onclick="chooseCourse('${which}',${i},0)">${u.unit}<small>${u.lessons.length} 个示例课时</small></button>`).join('')}</div><h2 class="selection-title">选择课时</h2><div class="selection-row">${chosen.lessons.map((l,i)=>`<button class="lesson-choice ${i===lesson?'selected':''}" onclick="chooseCourse('${which}',${unit},${i})">${l.name}<small>${l.section || '综合'} · 5 个知识点</small></button>`).join('')}</div><h2 class="selection-title">本次学习</h2><div class="tip">${course.items.map(x=>x[0]).join('　·　')}</div><div class="controls"><button class="button" onclick="start('${which}')">开始冒险</button><button class="button secondary" onclick="home()">返回营地</button></div></section>`;window.scrollTo(0,0)}
const encounterTypes=[{name:"补给旅人",icon:"✚",effect:"答对恢复 1 点生命（最多 3 点）",kind:"heal"},{name:"星尘宝箱",icon:"✦",effect:"答对获得 5 星尘",kind:"treasure"},{name:"迷雾守卫",icon:"◆",effect:"答对驱散迷雾，继续前进",kind:"guardian"}];function shuffleEncounters(){let list=[...encounterTypes];for(let i=list.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}function currentEncounter(){return run.idx>=1&&run.idx<=4?run.encounters[run.idx-1]:run.idx===5?{name:"最终试炼",icon:"✺",effect:"突破最后的挑战",kind:"boss"}:null}function start(which){if(selectedCourse.which!==which){chooseCourse(which);return}const lesson=curriculum[which][selectedCourse.unit].lessons[selectedCourse.lesson];bank[which].knowledge=lesson.items.map(x=>`<li><strong>${x[0]}</strong>：${x[1]}</li>`).join('');bank[which].recall='在不看卡牌的情况下，试着写出这五个知识点之间的联系：'+lesson.items.map(x=>x[0]).join('、');bank[which].stages=[{title:'知识觉醒',type:'recall'},...lesson.items.map((x,i)=>({title:(i===4?'首领 · ':'')+x[0],q:x[2],opts:x[3],answer:x[4],explain:x[5],hint:'请先找出材料中的关键事实，再判断它与“'+x[0]+'”之间的联系。'}))];run={which,idx:0,hp:3,correct:0,hints:0,errors:0,relic:null,recall:'',hintUsed:false,answered:false,seed:Math.random(),bonus:0, recallIndex:0, recallReview:[], encounters:[...shuffleEncounters(),encounterTypes[Math.floor(Math.random()*encounterTypes.length)]]};$('#home').classList.add('hidden');$('#game').classList.remove('hidden');render();window.scrollTo(0,0)}function home(){run=null;$('#game').classList.add('hidden');$('#home').classList.remove('hidden');update();window.scrollTo(0,0)}function shell(content){let b=bank[run.which];return `<div class="battle-head"><div><span class="eyebrow">✦ MEMORY EXPEDITION</span><h1>${b.icon} ${b.name}</h1></div><button class="button secondary" onclick="home()">返回营地</button></div><div class="battle-grid"><aside class="journey frame"><h2>冒险路线</h2>${b.stages.map((s,i)=>`<div class="node ${i===run.idx?'active':i<run.idx?'done':''}">${i<run.idx?'◆':i===run.idx?'▶':'◇'} ${s.title}</div>`).join('')}<div class="tip" style="margin-top:22px">${run.which==='politics'?'留意材料中的主体、行为与原理。':'从史料出发，连接背景与因果。'}</div></aside><section class="arena frame">${content}</section></div>`}function stageHeader(){return `<div class="stage-top"><span>第 ${run.idx+1} / 6 关</span><span id="battle-stats">生命 ${'♥'.repeat(run.hp)}${'♡'.repeat(3-run.hp)}　✦ 独立答对 ${run.correct}　${run.relic?'遗物：'+run.relic.name:''}</span></div><div class="map-row">${bank[run.which].stages.map((s,i)=>`<span class="map-dot ${i===run.idx?'on':''}">${i+1} ${s.title}</span>`).join('')}</div>`}function portrait(kind){const art={heal:{hair:'#b66d58',cloth:'#77b4aa',hat:'#e9d6bd',detail:'#f3a9a0'},treasure:{hair:'#b58146',cloth:'#c69254',hat:'#e4ba70',detail:'#f8da8d'},guardian:{hair:'#363650',cloth:'#66537c',hat:'#8c88a6',detail:'#a8d3df'},boss:{hair:'#252338',cloth:'#92536e',hat:'#d8b276',detail:'#ed9b9f'}}[kind]||{hair:'#534257',cloth:'#ae8c82',hat:'#e8c99e',detail:'#f2d0a2'};return `<svg viewBox="0 0 32 40" shape-rendering="crispEdges" aria-hidden="true"><path fill="#292239" d="M8 2h16v2h3v4h2v9h-2v4h2v4h2v12h-5v3H6v-3H2V25h2v-4h2v-4H4V8h2V4h2z"/><path fill="${art.hat}" d="M7 5h18v4H7zM10 2h12v3H10z"/><path fill="${art.hair}" d="M7 9h18v5h-3v-2H10v5H7z"/><path fill="#e7b69b" d="M10 12h13v8h-2v2h-9v-2h-2z"/><path fill="#34273c" d="M13 15h2v2h-2zm7 0h2v2h-2z"/><path fill="${art.cloth}" d="M9 22h15v3h3v10H6V25h3z"/><path fill="${art.detail}" d="M14 22h5v4h-5zm1 6h3v3h-3z"/><path fill="#e9b69a" d="M5 26h3v6H5zm20 0h3v6h-3z"/><path fill="#292239" d="M8 35h7v4H8zm10 0h7v4h-7z"/></svg>`}
function runnerScene(){return `<div class="run-stage ${run.which==='history'?'history-world':''} ${motionPaused?'paused':''}" role="group" aria-label="像素旅人正在${run.which==='history'?'历史长廊':'观念之境'}奔跑"><div class="stars"></div><div class="moon"></div><div class="scenery"></div><div class="ground"></div><div class="runner-shadow"></div><span class="trail">···</span><div class="runner"><svg viewBox="0 0 32 46" aria-hidden="true"><g class="leg back"><path fill="#302b49" d="M13 28h5v10h-2v4h-6v-3h3z"/><path fill="#e0ac8d" d="M10 40h6v3h-8v-2h2z"/></g><g class="arm back"><path fill="#ad726d" d="M11 17h5v9h-3v3H9v-3h2z"/></g><path fill="#a26b69" d="M10 16h11v13H9V20h1z"/><path fill="#e8b897" d="M11 6h11v10H11z"/><path fill="#332640" d="M9 7V4h3V2h9v2h3v6h-3V8H13v3H9z"/><path fill="#553648" d="M22 10h2v3h-2z"/><path fill="#f4d2a6" d="M13 13h2v2h-2z"/><path fill="#f3c778" d="M9 17h13v3H9z"/><g class="scarf"><path fill="#f2c778" d="M10 18H5v3H1v3h8v-2h4z"/></g><path fill="#57416a" d="M11 22h11v7H11z"/><path fill="#c99576" d="M10 27h12v4H10z"/><g class="leg front"><path fill="#4a3554" d="M17 28h5v10h3v4h-7v-4h-1z"/><path fill="#efc09a" d="M18 40h8v3h-8z"/></g><g class="arm front"><path fill="#e5b492" d="M19 18h4v8h-2v3h-4v-3h2z"/></g><path fill="#816190" d="M9 20h3v7H9z"/></svg></div>${currentEncounter()?`<div class="encounter-object" aria-hidden="true">${portrait(currentEncounter().kind)}</div><span class="encounter-name">${currentEncounter().name}</span>`:''}<span class="scene-effect" aria-hidden="true"></span><span class="run-label">${run.which==='history'?'时光长廊':'观念之境'} · 前行中</span><button class="motion-toggle" onclick="toggleMotion()" aria-label="${motionPaused?'播放':'暂停'}奔跑动画">${motionPaused?'▶ 播放动画':'Ⅱ 暂停动画'}</button></div>`}function toggleMotion(){motionPaused=!motionPaused;const scene=document.querySelector('.run-stage');scene.classList.toggle('paused',motionPaused);const button=scene.querySelector('.motion-toggle');button.textContent=motionPaused?'▶ 播放动画':'Ⅱ 暂停动画';button.setAttribute('aria-label',(motionPaused?'播放':'暂停')+'奔跑动画')}
function studyItem(){return curriculum[run.which][selectedCourse.unit].lessons[selectedCourse.lesson].items[run.recallIndex]}function renderRecall(){let item=studyItem();$('#game').innerHTML=shell(stageHeader()+runnerScene()+`<div class="enemy"><div class="enemy-art">📖</div><div><h2>知识觉醒</h2><p>逐个回忆，再对照卡牌。每次只需专注一个知识点。</p></div></div><div class="memory-steps">${[0,1,2,3,4].map((_,i)=>`<span class="memory-step ${i===run.recallIndex?'current':i<run.recallIndex?'finished':''}">${i+1} ${i<run.recallIndex?'已对照':i===run.recallIndex?'正在回忆':'待回忆'}</span>`).join('')}</div><div class="question"><h3>第 ${run.recallIndex+1} / 5 个知识点 · ${item[0]}</h3><p>先不看答案，试着写出这个知识点的含义；如果不记得，可以直接查看知识卡。</p></div><textarea id="recall" aria-label="写下你的回忆" placeholder="用自己的话写下你记得的内容……"></textarea><div class="controls"><button class="button" onclick="reveal()">翻开这张知识卡</button></div><div id="recall-result"></div>`)}function historyMap(){const lesson=curriculum.history[selectedCourse.unit].lessons[selectedCourse.lesson].name;const world=/世界|全球|工业|贸易|文化交流|宗教|大战/.test(lesson);const tag=world?'世界视野':'中国及东亚视野';const glow=world?'<circle class="map-glow" cx="141" cy="52" r="15" fill="#ffc981" opacity=".65"/><circle class="map-glow" cx="251" cy="63" r="13" fill="#a9e8cf" opacity=".55"/>':'<circle class="map-glow" cx="251" cy="63" r="17" fill="#ffcf89" opacity=".68"/>';return `<div class="history-map"><header><strong>◈ 动态历史地图</strong><span>${tag}</span></header><svg viewBox="0 0 360 150" role="img" aria-label="${tag}的简化世界地图示意图"><rect width="360" height="150" fill="#203f4d"/><g stroke="#72949a" stroke-width=".5" opacity=".3"><path d="M0 40H360M0 75H360M0 110H360M90 0V150M180 0V150M270 0V150"/></g><g fill="#799c91" stroke="#bad3b5" stroke-width="1"><path d="M20 28l16-12 26 1 16 9 6 15-10 5-6 13-17 4-9 14-9-4-1-12-13-10z"/><path d="M71 72l17 2 11 13-5 23-9 23-9-6-4-22-8-14z"/><path d="M131 28l15-8 18 7 5 9-7 7-5 13-11 2-12-10z"/><path d="M144 57l23-4 16 12-2 24-14 24-12-7-9-25-8-12z"/><path d="M169 25l32-12 51 5 24 10 31 4 14 13-12 13-22-1-14 12-16-2-8 10-17-10-15 3-12-15-15-5-13-11z"/><path d="M284 105l19-7 20 6 7 14-11 8-26-2-10-9z"/></g>${glow}<text x="224" y="61" fill="#fff4dc" font-size="9">东亚</text><text x="127" y="22" fill="#fff4dc" font-size="9">欧洲</text><text x="18" y="104" fill="#bdd4d0" font-size="9">美洲</text><text x="145" y="130" fill="#bdd4d0" font-size="9">非洲</text></svg><div class="map-note">示意图仅用于空间定位，不表示历史疆界、确切路线或范围。${world?'本课涉及多地区，结合材料确认具体地点。':'本课以中国及东亚相关内容为主。'}</div></div>`}
function render(){let b=bank[run.which],s=b.stages[run.idx];if(s.type==='recall'){renderRecall();return}let order=[0,1,2].sort((a,c)=>((a*7+Math.floor(run.seed*100)+run.idx)%3)-((c*7+Math.floor(run.seed*100)+run.idx)%3));$('#game').innerHTML=shell(stageHeader()+runnerScene()+`<div class="enemy"><div class="enemy-art">${run.idx===5?'👁':run.which==='politics'?'✦':'⌛'}</div><div><h2>${s.title}</h2><p>${run.idx===5?'首领挑战 · 组合你收集的思路':'选出最合适的卡牌，说明由线索通向答案的路径。'}</p></div></div>${run.which==='history'?historyMap():''}<div class="tip">旅途遭遇 · <strong>${currentEncounter().name}</strong>：${currentEncounter().effect}。答错失去 1 点生命；护符可抵挡一次。</div><div class="question"><h3>${run.which==='politics'?'材料与设问':'史料与设问'}</h3><p>${s.q}</p></div><div class="options">${order.map((n,i)=>`<button class="option" data-answer="${n}" onclick="answer(${n})">${String.fromCharCode(65+i)}. ${s.opts[n]}</button>`).join('')}</div><div class="controls"><button class="button secondary" id="hint" onclick="hint()">查看思路提示</button></div><div id="response" aria-live="polite"></div>`)}function reveal(){let item=studyItem();let wrong=item[3].filter((x,i)=>i!==item[4])[0];$('#recall-result').innerHTML=`<div class="knowledge-card"><h3>✦ ${item[0]}</h3><h4>要掌握的内容</h4><p>${item[1]}</p><h4>放进题目中</h4><blockquote>${item[2]}</blockquote><p><strong>判断方向：</strong>${item[3][item[4]]}。${item[5]}</p><h4>容易误判的说法</h4><p>${wrong}。这不是本题的正确判断，注意题目条件与范围。</p></div><p class="sub">对照后自己判断记忆情况；系统不自动批改你的文字。</p><div class="recall-nav"><button class="button" onclick="nextRecall(true)">记住了，继续</button><button class="button secondary" onclick="nextRecall(false)">还需复习，继续</button></div>`;document.querySelector('#recall').disabled=true;document.querySelector('.controls button').disabled=true}function nextRecall(remembered){run.recallReview[run.recallIndex]=remembered;if(run.recallIndex<4){run.recallIndex++;renderRecall();return}chooseRelic()}
function chooseRelic(){let relics=[{name:'洞察之灯',desc:'每次答题可以查看线索提示。',icon:'✦'},{name:'旅人的护符',desc:'本局生命上限保持 3；获得一次免伤。',icon:'◇'},{name:'记忆之羽',desc:'结算额外获得 5 星尘。',icon:'❋'}];$('#game').innerHTML=shell(stageHeader()+runnerScene()+`<div class="enemy"><div class="enemy-art">✧</div><div><h2>选择一件遗物</h2><p>每次冒险选择一件，影响本局旅程。</p></div></div><div class="relics">${relics.sort(()=>Math.random()-.5).map(x=>`<button class="relic" onclick="selectRelic('${x.name}')"><span style="font-size:30px">${x.icon}</span><b>${x.name}</b><small>${x.desc}</small></button>`).join('')}</div>`)}function selectRelic(n){run.relic={name:n,shield:n==='旅人的护符'};run.idx=1;render()}function hint(){if(run.hintUsed)return;run.hintUsed=true;run.hints++;$('#response').innerHTML=`<div class="feedback"><strong>思路提示</strong><br>${bank[run.which].stages[run.idx].hint}</div>`;$('#hint').disabled=true}function answer(n){if(run.answered)return;run.answered=true;let s=bank[run.which].stages[run.idx],ok=n===s.answer,encounter=currentEncounter(),blocked=false,effectText='';document.querySelectorAll('.option').forEach(el=>{el.disabled=true;if(+el.dataset.answer===s.answer)el.classList.add('correct');if(+el.dataset.answer===n&&!ok)el.classList.add('wrong')});$('#hint').disabled=true;if(ok&&!run.hintUsed){run.correct++;save.correct++}if(ok){if(encounter.kind==='heal'){let before=run.hp;run.hp=Math.min(3,run.hp+1);effectText=run.hp>before?'生命 +1':'生命已满'}else if(encounter.kind==='treasure'){run.bonus+=5;effectText='星尘 +5'}else{effectText=encounter.kind==='boss'?'试炼突破':'迷雾驱散'}}else{run.errors++;if(run.relic?.shield){run.relic.shield=false;blocked=true;effectText='护符抵挡伤害'}else{run.hp=Math.max(0,run.hp-1);effectText='生命 −1'}}let scene=$('.run-stage');scene.classList.add(ok?'success':blocked?'blocked':'hit');scene.querySelector('.scene-effect').textContent=effectText;$('#battle-stats').textContent=`生命 ${'♥'.repeat(run.hp)}${'♡'.repeat(3-run.hp)}　✦ 独立答对 ${run.correct}　${run.relic?'遗物：'+run.relic.name:''}`;let next=run.hp<=0?'查看本局战报':run.idx===5?'完成冒险':'继续前进';$('#response').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?(run.hintUsed?'答对了 · 本题使用了提示':'答对了 · 独立完成'):'这次没有选对'} · ${effectText}</strong><br>${s.explain}</div><div class="controls"><button class="button" onclick="nextStage()">${next}</button></div>`;persist()}function nextStage(){if(run.hp<=0||run.idx===5){finish();return}run.idx++;run.hintUsed=false;run.answered=false;render()}function finish(){let won=run.hp>0&&run.idx===5;let xp=run.correct*5+(won?10:0)+(run.relic?.name==='记忆之羽'?5:0)+run.bonus;let beforeLevel=Math.floor(save.xp/50)+1;save.xp+=xp;let afterLevel=Math.floor(save.xp/50)+1;save.runs++;save.fragments+=run.correct;persist();$('#game').innerHTML=shell(`<div class="stage-top"><span>冒险结算</span><span>${won?'✦ 冒险完成':'◇ 本次暂告一段落'}</span></div><div class="enemy"><div class="enemy-art">${won?'🏆':'✧'}</div><div><h2>${won?'你穿过了记忆迷雾':'休息一下，再次出发'}</h2><p>已经完成的学习过程都会保留下来。</p></div></div>${afterLevel>beforeLevel?`<div class="reward-alert">✦ 小忆升级了！LV. ${beforeLevel} → LV. ${afterLevel}，前往奖励小屋领取礼物。<div class="controls"><button class="button" onclick="openRewards()">查看升级奖励</button></div></div>`:''}<div class="question"><h3>本局战报</h3><p>独立答对：${run.correct} 题　·　使用提示：${run.hints} 次　·　答错：${run.errors} 题\n回忆卡：${run.recallReview.filter(Boolean).length} 个自评记住，${run.recallReview.filter(x=>x===false).length} 个待复习\n获得星尘：${xp}（含宝箱 ${run.bonus}）　·　知识碎片：${run.correct} 枚</p></div><div class="feedback"><strong>下次复习建议</strong><br>${run.which==='politics'?'尝试先划出材料中的具体行为，再解释它与原理的关系。':'尝试将史料中的事实按背景、原因和结果连接起来。'}${run.errors?' 本局有答错的题，建议重新进入路线，尝试不看提示再做一次。':''}<br><br>回忆题采用自主对照，不会被系统自动判对错。学习内容为示例练习，建议结合教材和老师讲解核对。</div><div class="controls"><button class="button" onclick="start('${run.which}')">再来一局</button><button class="button secondary" onclick="home()">返回营地</button></div>`);update()}update();
</script></body></html>
